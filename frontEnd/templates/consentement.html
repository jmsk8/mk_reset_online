<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Politique de confidentialité - MK Reset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bulma-0.9.4/bulma.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome-6.4.0/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interactions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/decor-mk.css') }}?v={{ app_version }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/mario/mario-static.png') }}">
</head>
<body>
    {% include 'decor.html' %}
    {% include 'navbar.html' %}

    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-6">
                    <div class="card glass-card">
                        <div class="card-content">
                            <h1 class="title is-4">Politique de confidentialité</h1>
                            <p class="mb-2">Pour continuer, acceptez la politique de confidentialité du site.</p>
                            <p class="mb-5">
                                <a href="/confidentialite" target="_blank" rel="noopener">
                                    Lire la politique
                                    <span class="icon is-small"><i class="fas fa-arrow-up-right-from-square"></i></span>
                                </a>
                            </p>

                            <form method="post" action="{{ url_for('consentement') }}">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <input type="hidden" name="suite" value="{{ suite }}">
                                <button type="submit" class="button is-primary is-fullwidth">
                                    <span class="icon"><i class="fas fa-check"></i></span>
                                    <span>J'ai lu et j'accepte</span>
                                </button>
                            </form>

                            <div class="buttons is-centered mt-4 mb-0">
                                <a class="button is-ghost is-small" href="/mon-compte/export">
                                    <span class="icon"><i class="fas fa-download"></i></span>
                                    <span>Télécharger mes données</span>
                                </a>
                                <form class="form-en-ligne" method="post" action="{{ url_for('player_logout') }}">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="button is-ghost is-small">
                                        <span class="icon"><i class="fas fa-right-from-bracket"></i></span>
                                        <span>Me déconnecter</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    {% include 'footer.html' %}
</body>
</html>
