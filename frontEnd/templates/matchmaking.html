<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/dark-mode.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/mario/mario-static.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/mario/mario-static.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/mario/mario-static.png') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        .player-item {
            cursor: pointer;
            padding: 10px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-item:hover {
            background: rgba(59, 130, 246, 0.5);
        }
        .player-list-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .ts-badge {
            font-size: 0.75rem;
            opacity: 0.7;
            font-variant-numeric: tabular-nums;
        }
        .lobby-card { margin-bottom: 1.5rem; }
        .lobby-player {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .lobby-player:last-child { border-bottom: none; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered mb-6">
                <i class="fas fa-random"></i> Matchmaking
            </h1>

            <div class="columns is-variable is-6">
                <div class="column is-4">
                    <div class="card glass-card" style="height: 100%;">
                        <div class="card-content">
                            <h3 class="title is-5 has-text-light has-text-centered mb-4">
                                <i class="fas fa-list-ol"></i> Joueurs Disponibles
                            </h3>

                            <div class="field mb-4">
                                <p class="control has-icons-left">
                                    <input class="input has-background-dark has-text-light" style="border-color: #555;" type="text" id="searchPlayer" placeholder="Chercher un joueur...">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-search"></i>
                                    </span>
                                </p>
                            </div>

                            <hr style="background-color: #555; margin: 1rem 0;">

                            <div id="players-pool" class="player-list-container">
                                <div class="has-text-centered mt-5">
                                    <i class="fas fa-circle-notch fa-spin fa-2x has-text-grey"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="column is-8">
                    <div class="card glass-card" style="height: 100%;">
                        <div class="card-content">
                            <label class="label has-text-light">Participants sélectionnés (<span id="selCount">0</span>)</label>

                            <div class="table-container">
                                <table class="table is-fullwidth is-hoverable has-background-transparent">
                                    <thead>
                                        <tr>
                                            <th class="has-text-light">Joueur</th>
                                            <th class="has-text-light has-text-right" style="width: 120px;">TrueSkill</th>
                                            <th style="width: 50px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="participantsList"></tbody>
                                </table>
                                <p id="emptyMsg" class="has-text-grey has-text-centered mt-4">
                                    Sélectionnez les joueurs présents dans la liste de gauche.
                                </p>
                            </div>

                            <div class="field is-grouped is-grouped-centered mt-5">
                                <div class="control">
                                    <button class="button is-primary is-medium" id="btnGenerate">
                                        <span class="icon"><i class="fas fa-random"></i></span>
                                        <span>Générer les lobbies</span>
                                    </button>
                                </div>
                            </div>

                            <div id="lobbies-result" class="mt-5"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

<script>
        const MAX_PER_LOBBY = 10;

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function buildLobbies(players) {
            const n = players.length;
            if (n === 0) return [];

            const k = Math.ceil(n / MAX_PER_LOBBY);
            if (k === 1) return [players.slice()];

            const base = Math.floor(n / k);
            const pivots = n % k;

            const sizes = new Array(k).fill(base);
            let cursor = 0;
            let placed = 0;

            for (let i = 0; i < k; i++) {
                let size = sizes[i];
                const remainingPivots = pivots - placed;
                if (i < k - 1 && remainingPivots > 0) {
                    const pivotIdx = cursor + size;
                    const above = players[pivotIdx - 1];
                    const pivot = players[pivotIdx];
                    const below = players[pivotIdx + 1] !== undefined ? players[pivotIdx + 1] : null;

                    const gapUp = Math.abs(pivot.ts - above.ts);
                    const gapDown = below ? Math.abs(pivot.ts - below.ts) : Infinity;

                    if (gapUp <= gapDown) {
                        size += 1;
                        placed += 1;
                    }
                    else {
                        sizes[i + 1] += 1;
                        placed += 1;
                    }
                }
                cursor += size;
                sizes[i] = size;
            }

            const lobbies = [];
            let idx = 0;
            for (let i = 0; i < k; i++) {
                lobbies.push(players.slice(idx, idx + sizes[i]));
                idx += sizes[i];
            }
            return lobbies;
        }

        document.addEventListener('DOMContentLoaded', () => {
            let availablePlayers = [];
            let selected = []; // [{nom, ts}]

            const poolContainer = document.getElementById('players-pool');
            const tableBody = document.getElementById('participantsList');
            const searchInput = document.getElementById('searchPlayer');
            const emptyMsg = document.getElementById('emptyMsg');
            const selCount = document.getElementById('selCount');
            const btnGenerate = document.getElementById('btnGenerate');
            const resultBox = document.getElementById('lobbies-result');

            fetch('/joueurs/noms')
                .then(res => res.json())
                .then(data => {
                    availablePlayers = Array.isArray(data) ? data : [];
                    renderPool();
                })
                .catch(err => {
                    console.error(err);
                    poolContainer.innerHTML = '<p class="has-text-danger has-text-centered">Erreur de chargement.</p>';
                });

            function isSelected(nom) {
                return selected.some(p => p.nom === nom);
            }

            function renderPool() {
                const filterText = searchInput.value.toLowerCase();
                poolContainer.innerHTML = '';

                availablePlayers.forEach(player => {
                    const nom = player.nom;
                    if (!nom.toLowerCase().includes(filterText)) return;
                    if (isSelected(nom)) return;

                    const ts = Number(player.score_trueskill) || 0;
                    const div = document.createElement('div');
                    div.className = 'player-item has-text-light';
                    div.innerHTML = `<span><i class="fas fa-user mr-2"></i>${escapeHtml(nom)}</span>` +
                                    `<span class="ts-badge">${ts.toFixed(2)}</span>`;
                    div.onclick = () => selectPlayer(nom, ts);
                    poolContainer.appendChild(div);
                });

                if (poolContainer.children.length === 0) {
                    poolContainer.innerHTML = '<p class="has-text-grey has-text-centered is-size-7 mt-2">Aucun joueur correspondant</p>';
                }
            }

            function selectPlayer(nom, ts) {
                selected.push({ nom, ts });
                renderPool();
                renderSelected();
            }

            function removePlayer(nom) {
                selected = selected.filter(p => p.nom !== nom);
                renderPool();
                renderSelected();
            }

            function renderSelected() {
                tableBody.innerHTML = '';
                selected.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="has-text-white is-vcentered" style="font-weight:bold;">${escapeHtml(p.nom)}</td>
                        <td class="has-text-light has-text-right is-vcentered" style="font-variant-numeric: tabular-nums;">${p.ts.toFixed(2)}</td>
                        <td class="is-vcentered">
                            <button class="button is-small is-danger is-outlined btn-remove">
                                <i class="fas fa-times"></i>
                            </button>
                        </td>`;
                    tr.querySelector('.btn-remove').addEventListener('click', () => removePlayer(p.nom));
                    tableBody.appendChild(tr);
                });
                selCount.textContent = selected.length;
                emptyMsg.style.display = selected.length === 0 ? 'block' : 'none';
            }

            searchInput.addEventListener('input', renderPool);

            btnGenerate.addEventListener('click', () => {
                if (selected.length < 2) {
                    alert("⚠️ Sélectionnez au moins 2 joueurs.");
                    return;
                }

                const sorted = selected.slice().sort((a, b) => b.ts - a.ts);
                const lobbies = buildLobbies(sorted);

                resultBox.innerHTML = '';
                lobbies.forEach((lobby, i) => {
                    const avg = lobby.reduce((s, p) => s + p.ts, 0) / lobby.length;
                    const card = document.createElement('div');
                    card.className = 'card glass-card lobby-card';
                    const rows = lobby.map(p =>
                        `<div class="lobby-player has-text-light">
                            <span><i class="fas fa-user mr-2"></i>${escapeHtml(p.nom)}</span>
                            <span class="ts-badge">${p.ts.toFixed(2)}</span>
                        </div>`).join('');
                    card.innerHTML = `
                        <div class="card-content">
                            <h4 class="title is-5 has-text-light mb-3">
                                <i class="fas fa-users mr-2"></i>Lobby ${i + 1}
                                <span class="tag is-info is-light ml-2">${lobby.length} joueurs</span>
                                <span class="tag is-dark ml-1">moy. ${avg.toFixed(2)}</span>
                            </h4>
                            ${rows}
                        </div>`;
                    resultBox.appendChild(card);
                });
                resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        });
    </script>
</body>
</html>
