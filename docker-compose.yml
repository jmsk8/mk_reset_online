# Rotation des journaux -- T5 du registre RGPD (docs/rgpd-registre.md).
#
# Duree de conservation annoncee aux visiteurs : 6 MOIS (/confidentialite, via
# SITE_RETENTION_LOGS). Les journaux d'acces contiennent des adresses IP, et le
# chemin d'une invitation contient son jeton : ce n'est pas une donnee anodine.
#
# POURQUOI journald ET PAS json-file. Le pilote json-file ne sait borner que la
# TAILLE (10 Mo x 3 fichiers). Une borne de taille n'est pas une duree : sur un
# site peu frequente une ligne survit bien au-dela de 6 mois, sur un site charge
# elle disparait avant. On annoncait donc une duree que rien ne tenait --
# et une duree annoncee qu'on ne tient pas est pire que pas de duree du tout.
# journald, lui, expire par AGE : c'est le seul pilote qui rende l'annonce
# exacte.
#
# ⚠️ DEUX REGLAGES SUR L'HOTE, sans lesquels cette bascule DEGRADE la situation
# au lieu de l'ameliorer (/etc/systemd/journald.conf, ou un fichier dans
# /etc/systemd/journald.conf.d/) :
#
#     [Journal]
#     Storage=persistent       # SINON les journaux vivent dans /run et sont
#                              # PERDUS A CHAQUE REBOOT -- le defaut sur
#                              # beaucoup de distributions, verifie une fois
#                              # ici : /var/log/journal n'existait pas.
#     MaxRetentionSec=6month   # la duree annoncee, enfin imposee
#     SystemMaxUse=500M        # garde-fou disque, independant de l'age
#
# Puis : sudo systemctl restart systemd-journald && docker compose up -d
# Verifier : journalctl -t mk-nginx -n 5   (doit sortir des lignes)
#
# Tant que ces reglages ne sont pas poses, NE PAS considerer T5 comme clos.
x-journaux: &journaux
  driver: journald
  # Un tag par conteneur, sinon tout arrive sous le meme nom et
  # `journalctl -t` ne sait plus separer nginx de backend.
  options:
    tag: "mk-{{.Name}}"

services:
  db:
      image: postgres:17-alpine
      volumes:
        - pg_data:/var/lib/postgresql/data
        - ./backEnd/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
        - ./backEnd/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      logging: *journaux
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
      deploy:
        resources:
          limits:
            cpus: '0.5'
            memory: 256M
      networks:
        - backend

  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile.backend
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backEnd/backend.py:/app/backend.py
      - ./backEnd/constants.py:/app/constants.py
      - ./backEnd/db.py:/app/db.py
      - ./backEnd/cache.py:/app/cache.py
      - ./backEnd/auth.py:/app/auth.py
      - ./backEnd/utils.py:/app/utils.py
      - ./backEnd/services.py:/app/services.py
      - ./backEnd/routes_public.py:/app/routes_public.py
      - ./backEnd/routes_admin.py:/app/routes_admin.py
      # Le Dockerfile fait COPY *.py : un module absent de cette liste marche
      # apres un build, puis reste FIGE — les editions sur l'hote ne sont plus
      # prises en compte au restart, contrairement a tous les autres fichiers.
      - ./backEnd/auth_discord.py:/app/auth_discord.py
      - ./backEnd/routes_auth.py:/app/routes_auth.py
      - ./backEnd/routes_comptes.py:/app/routes_comptes.py
      - ./backEnd/routes_bot.py:/app/routes_bot.py

    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      # OAuth Discord. DISCORD_REDIRECT_URI est fixe ici et jamais construit par
      # url_for(_external=True) : Flask est derriere deux proxys sans ProxyFix
      # et produirait du http://, que Discord refuse sans message utile.
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      # Amorcage du premier superadmin, sans effet des qu'il en existe un.
      - DISCORD_SUPERADMIN_ID=${DISCORD_SUPERADMIN_ID:-}
    logging: *journaux
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - backend

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile.frontend
    expose:
      - "5000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - SECRET_KEY=${SECRET_KEY}
      - TLS_MODE=${TLS_MODE:-http}
      # Le frontend construit lui-meme l'URL d'autorisation Discord et affiche
      # le bouton de connexion : sans ces deux variables, discord_configure est
      # faux, la navbar n'offre aucune connexion et /auth/discord/login refuse.
      # Le SECRET Discord, lui, reste au seul backend : le frontend n'echange
      # aucun code, il delegue a /auth/discord/exchange.
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      # Le repli n'est PAS vide : une variable absente arriverait comme une
      # chaine vide, et la page legale afficherait un editeur blanc.
      - SITE_EDITEUR=${SITE_EDITEUR:-à renseigner}
      - SITE_CONTACT=${SITE_CONTACT:-à renseigner}
      - SITE_HEBERGEUR=${SITE_HEBERGEUR:-à renseigner}
      - SITE_RETENTION_LOGS=${SITE_RETENTION_LOGS:-6 mois au maximum}
    logging: *journaux
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    networks:
      - frontend
      - backend

  race:
    build:
      # Le moteur se choisit avec `make engine-js` / `make engine-cpp`, qui
      # ecrivent `.engine`. Le repli sur ./raceEngine couvre un `docker compose`
      # tape a la main, hors du Makefile qui exporte la variable.
      context: ${RACE_CONTEXT:-./raceEngine}
    expose:
      - "3000"
    volumes:
      # Les circuits sont dessinés, pas compilés : montés, ils se retouchent
      # sans reconstruire l'image. `make restart-race` relit le dossier. Le
      # moteur, lui, est copié dans l'image — c'est du code serveur, le
      # navigateur ne le charge plus.
      - ./tracks:/app/tracks:ro
    environment:
      - PORT=3000
      # Vide = toutes origines acceptées. À renseigner en production, sinon
      # n'importe quel site peut ouvrir une connexion permanente sur ce service.
      - ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
    logging: *journaux
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      # Surtout pas `backend` : ce service n'a rien à faire près de la base. Ni
      # session, ni cookie, ni accès Postgres — c'est ce qui rend acceptable
      # d'exposer une connexion permanente non authentifiée.
      - frontend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PUBLISH:-0.0.0.0:80}:80"
      - "${HTTPS_PUBLISH:-0.0.0.0:443}:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - TLS_MODE=${TLS_MODE:-http}
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates/${TLS_MODE:-http}
      - NGINX_ENVSUBST_FILTER=^DOMAIN$$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/99-certbot-reload.sh:/docker-entrypoint.d/99-certbot-reload.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      race:
        condition: service_healthy
    logging: *journaux
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - frontend

volumes:
  pg_data:

networks:
  frontend:
  backend:
