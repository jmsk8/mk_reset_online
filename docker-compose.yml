# Journaux via journald, qui expire par age (json-file ne borne que la taille) :
# conservation annoncee de 6 mois (SITE_RETENTION_LOGS, registre RGPD T5).
# Reglages requis sur l'hote : deploy/host/journald-mk.conf.
x-journaux: &journaux
  driver: journald
  # Un tag par conteneur, pour `journalctl -t`.
  options:
    tag: "mk-{{.Name}}"

services:
  db:
      image: postgres:17-alpine
      volumes:
        - pg_data:/var/lib/postgresql/data
        - ./backEnd/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
        - ./backEnd/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      logging: *journaux
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
      deploy:
        resources:
          limits:
            cpus: '0.5'
            memory: 256M
      networks:
        - backend

  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile.backend
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backEnd/backend.py:/app/backend.py
      - ./backEnd/constants.py:/app/constants.py
      - ./backEnd/db.py:/app/db.py
      - ./backEnd/cache.py:/app/cache.py
      - ./backEnd/auth.py:/app/auth.py
      - ./backEnd/utils.py:/app/utils.py
      - ./backEnd/services.py:/app/services.py
      - ./backEnd/routes_public.py:/app/routes_public.py
      - ./backEnd/routes_admin.py:/app/routes_admin.py
      # Le Dockerfile copie *.py : chaque module doit etre monte ici, sinon il
      # reste fige a la version du build.
      - ./backEnd/auth_discord.py:/app/auth_discord.py
      - ./backEnd/routes_auth.py:/app/routes_auth.py
      - ./backEnd/routes_comptes.py:/app/routes_comptes.py
      - ./backEnd/routes_bot.py:/app/routes_bot.py
      - ./backEnd/textes_ip.py:/app/textes_ip.py

    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # OAuth Discord. DISCORD_REDIRECT_URI est fixe (derriere deux proxys,
      # url_for produirait du http://). Plusieurs URI possibles, separees par
      # des virgules ; chacune doit etre declaree dans le portail Discord.
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      # Amorcage du premier superadmin, sans effet des qu'il en existe un.
      - DISCORD_SUPERADMIN_ID=${DISCORD_SUPERADMIN_ID:-}
    logging: *journaux
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - backend

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile.frontend
    expose:
      - "5000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - SECRET_KEY=${SECRET_KEY}
      - TLS_MODE=${TLS_MODE:-http}
      # Necessaires a l'URL d'autorisation et au bouton de connexion ; le secret
      # reste au backend (/auth/discord/exchange).
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      # Repli non vide : sinon la page legale afficherait un champ vide.
      - SITE_EDITEUR=${SITE_EDITEUR:-à renseigner}
      - SITE_CONTACT=${SITE_CONTACT:-à renseigner}
      - SITE_HEBERGEUR=${SITE_HEBERGEUR:-à renseigner}
      - SITE_RETENTION_LOGS=${SITE_RETENTION_LOGS:-6 mois au maximum}
    logging: *journaux
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    networks:
      - frontend
      - backend

  race:
    build:
      # Moteur choisi par `make engine-js` / `make engine-cpp` (fichier
      # `.engine`) ; repli sur ./raceEngine hors Makefile.
      context: ${RACE_CONTEXT:-./raceEngine}
    expose:
      - "3000"
    volumes:
      # Circuits montes : modifiables sans rebuild, relus par `make restart-race`.
      - ./tracks:/app/tracks:ro
    environment:
      - PORT=3000
      # Vide = toutes origines acceptées ; à renseigner en production.
      - ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
    logging: *journaux
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      # Pas `backend` : ce service n'a besoin ni de la base ni des sessions.
      - frontend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PUBLISH:-0.0.0.0:80}:80"
      - "${HTTPS_PUBLISH:-0.0.0.0:443}:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - TLS_MODE=${TLS_MODE:-http}
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates/${TLS_MODE:-http}
      - NGINX_ENVSUBST_FILTER=^DOMAIN$$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      # Mode maintenance (scripts/maintenance.sh) : dossier entier, pour que
      # l'interrupteur puisse apparaître et disparaître.
      - ./nginx/maintenance:/etc/nginx/maintenance:ro
      # Décor de la page de maintenance, servi sans passer par le frontend.
      - ./frontEnd/static:/srv/mk-static:ro
      - ./nginx/docker-entrypoint.d/99-certbot-reload.sh:/docker-entrypoint.d/99-certbot-reload.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      race:
        condition: service_healthy
    logging: *journaux
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - frontend

volumes:
  pg_data:

networks:
  frontend:
  backend:
