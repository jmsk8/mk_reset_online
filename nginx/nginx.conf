events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Sans ça, derrière un reverse proxy, le rate limiting verrait une seule IP.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Dimensionné sur une MESURE, et non à l'estime -- les trois réglages
    # précédents (30r/m, puis 2r/s) ont échoué faute de ce chiffre.
    #
    # Coût réel d'une ouverture de page, compté requête par requête :
    #   Fiches joueurs : 4   (document, /admin/joueurs, /admin/tiers, notifs)
    #   Comptes        : 5   (document, liaisons, comptes, 2 notifs)
    #   Réglages       : 6   (document, config, tiers, tier-distribution, 2 notifs)
    # La page la plus lourde vaut donc 6 requêtes, pas 1 ni 4.
    #
    # `rate=8r/s` : un utilisateur qui enchaîne les rafraîchissements en tient un
    # toutes les 0,75 s sans jamais entamer la réserve. C'est le rythme d'un
    # humain qui corrige et vérifie, celui qui a produit les 503 du 2026-09-17.
    # Une boucle automatisée, elle, tape à des centaines de requêtes/s : deux
    # ordres de grandeur au-dessus, la protection reste entière.
    #
    # La zone reste distincte de `general` (10r/s) : c'est elle qui couvre les
    # écritures admin, et la séparer garantit qu'une rafale de lectures publiques
    # ne consomme pas le budget de l'administration.
    #
    # Ce réglage n'était PAS la cause unique des 503 : chaque requête déclenchait
    # aussi jusqu'à 4 appels backend synchrones côté frontend, sur 2 workers qui
    # bloquaient pendant l'attente. Corrigé côté application (rapport ramené à
    # 1:1, workers threadés) AVANT de toucher à ce débit -- desserrer d'abord
    # aurait masqué le défaut au lieu de le corriger. Lire
    # docs/audit-503-zone-admin.md avant toute modification.
    limit_req_zone $binary_remote_addr zone=admin:10m rate=8r/s;
    # Zone dédiée à l'authentification : un parcours OAuth normal, c'est trois
    # requêtes (/invite/<token>, /auth/discord/login, /auth/discord/callback).
    # Une zone séparée évite qu'un bourrage d'invitations ne consomme le budget
    # des pages admin, et inversement.
    #
    # 20 r/m → 40 r/m le 2026-09-18, APRÈS la correction de B-01 et pas avant.
    # L'ordre n'est pas un détail : à 20 r/m, trois ou quatre reprises de
    # connexion épuisaient la réserve, et l'utilisateur recevait un 503 nginx à
    # la place du message applicatif. Desserrer d'abord aurait repoussé le seuil
    # en laissant la cause en place -- c'est l'erreur de méthode du §9 de
    # docs/audit-503-zone-admin.md, et elle a déjà coûté plusieurs jours sur la
    # zone admin.
    #
    # B-01 corrigé, les reprises deviennent rares : 40 r/m couvre ~13 parcours
    # complets par minute et par IP, largement au-delà d'un usage humain, tout
    # en restant la zone la plus stricte du projet. Volontairement modeste :
    # un budget large ici masquerait la prochaine boucle d'échec au lieu de la
    # révéler.
    #
    # ⚠️ Vérifier l'EFFET, jamais le geste : `docker compose exec nginx nginx -T
    # | grep "zone=auth"` doit confirmer la valeur SERVIE. nginx.conf est monté
    # comme fichier, Docker en fige l'inode, et un reload peut servir en silence
    # la configuration d'avant (§12 du même audit). `make reload-nginx` compare
    # désormais les empreintes et échoue si elles divergent.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=40r/m;
    # Zone propre aux bots : une machine en boucle d'erreur tape bien plus vite
    # qu'un humain, et ne doit pas consommer le budget des pages ni celui de
    # l'authentification.
    limit_req_zone $binary_remote_addr zone=bot:10m rate=60r/m;

    # Les limites ci-dessus comptent des requêtes ; une connexion WebSocket n'en
    # est qu'une, mais elle dure des heures. C'est le nombre de connexions
    # simultanées qu'il faut borner, pas leur fréquence.
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss;
    gzip_disable "msie6";

    include /etc/nginx/conf.d/*.conf;
}
