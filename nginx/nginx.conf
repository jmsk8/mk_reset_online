events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Sans ça, derrière un reverse proxy, le rate limiting verrait une seule IP.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;

    # Les limites ci-dessus comptent des requêtes ; une connexion WebSocket n'en
    # est qu'une, mais elle dure des heures. C'est le nombre de connexions
    # simultanées qu'il faut borner, pas leur fréquence.
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss;
    gzip_disable "msie6";

    include /etc/nginx/conf.d/*.conf;
}
