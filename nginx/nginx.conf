events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # IP réelle derrière le reverse proxy externe (réseau Docker `web`, voir
    # docker-compose.override.yml), pour le rate limiting. Le proxy écrase
    # X-Forwarded-For : une seule valeur, d'où `real_ip_recursive off`.
    # Sous-réseau à vérifier si `web` est recréé :
    #   docker network inspect web --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
    set_real_ip_from  172.20.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Admin : une page coûte jusqu'à 6 requêtes (Réglages : document, config,
    # tiers, tier-distribution, 2 notifs). Zone distincte de `general` pour que
    # les lectures publiques ne consomment pas le budget admin.
    limit_req_zone $binary_remote_addr zone=admin:10m rate=8r/s;
    # Authentification : un parcours OAuth = 3 requêtes (/invite/<token>,
    # /auth/discord/login, /auth/discord/callback) ; 40r/m en couvre ~13 par
    # minute et par IP.
    #
    # Après modification, vérifier la valeur servie :
    #   docker compose exec nginx nginx -T | grep "zone=auth"
    limit_req_zone $binary_remote_addr zone=auth:10m rate=40r/m;
    # Bots : zone séparée des pages et de l'authentification.
    limit_req_zone $binary_remote_addr zone=bot:10m rate=60r/m;

    # WebSocket : on borne les connexions simultanées, pas leur fréquence.
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript
               application/x-javascript application/xml application/xml+rss image/svg+xml;
    gzip_disable "msie6";

    # Un an pour ce qui est versionné, 7 jours sinon. Versionné : vendor/ (la
    # version est dans le nom du dossier) ou `v=` suivi des 10 caractères hexa
    # de l'empreinte calculée par frontend.py ; un autre `v=` ne compte pas.
    map $request_uri $cache_statique {
        "~^/static/vendor/"            "public, max-age=31536000, immutable";
        "~[?&]v=[0-9a-f]{10}(&|$)"     "public, max-age=31536000, immutable";
        default                        "public, max-age=604800";
    }

    include /etc/nginx/conf.d/*.conf;
}
