client_max_body_size 10M;

# ── Résolution DNS des services Docker ──────────────────────────────────────
# L'hôte passe par une variable : nginx résout alors le nom à chaque requête
# (résolveur Docker 127.0.0.11) et suit les conteneurs recréés par
# `make re-front`, `re-back` ou `build`. Avec un nom littéral, l'IP serait
# figée au chargement (502 après recréation).
#
# Conséquences :
#   1. l'URI n'est plus reprise automatiquement : `$request_uri` explicite sur
#      chaque `proxy_pass` ;
#   2. c'est ce qui autorise le `proxy_pass` dans la location regex des
#      fichiers statiques.
#
# `valid=10s` borne le cache DNS.
resolver 127.0.0.11 valid=10s ipv6=off;
set $front frontend:5000;

# ── Mode maintenance ────────────────────────────────────────────────────────
# `make maintenance-on` écrit nginx/maintenance/actif.conf, `make
# maintenance-off` le supprime (scripts/maintenance.sh). Absent, ce glob
# n'inclut rien. Le dossier est monté entier : un montage de fichier fige
# l'inode et le reload servirait l'ancien état.
include /etc/nginx/maintenance/actif*.conf;

# Page de maintenance aussi quand le frontend est injoignable (502/503/504 de
# nginx). Sans `proxy_intercept_errors`, un 503 de l'application passe tel
# quel. Le limiteur de débit répond 429, pas 503.
error_page 502 503 504 /_maintenance.html;
location = /_maintenance.html {
    internal;
    alias /etc/nginx/maintenance/page.html;
    default_type text/html;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    # Un add_header dans un bloc annule tous ceux du parent.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Ressources de la page de maintenance, lues dans frontEnd/static (le frontend
# peut être éteint). `^~` passe devant la location regex des statiques.
location ^~ /_maintenance/ {
    alias /srv/mk-static/;
    expires 1h;
    add_header X-Content-Type-Options "nosniff" always;
}

# 429 et non 503 (réservé à la maintenance) ; code testé par le JS admin
# (gestion.js, admin_saisons.html).
limit_req_status 429;
limit_conn_status 429;

# Page servie quand le limiteur rejette une requête, écrite ici pour rester
# disponible sans frontend. `internal` : uniquement sur redirection interne.
error_page 429 /_limite.html;
location = /_limite.html {
    internal;
    default_type text/html;
    # Délai avant de réessayer, de quoi recharger une page entière.
    add_header Retry-After 5 always;
    return 429 '<!doctype html><html lang="fr"><meta charset="utf-8">
<title>Trop de requetes</title>
<style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1rem;line-height:1.6}h1{font-size:1.4rem}</style>
<h1>Un instant</h1>
<p>Trop de requetes ont ete envoyees depuis cet appareil en peu de temps.
Le serveur les limite volontairement.</p>
<p><strong>Patientez cinq secondes</strong>, puis rechargez la page.
Rafraichir tout de suite ne fera que prolonger l\'attente.</p>';
}

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Static file caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
    # Un add_header dans un bloc annule ceux du parent : en-têtes de sécurité
    # répétés ici.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Avatars : sans limiteur, comme les fichiers statiques. Leur URI n'a pas
# d'extension et tomberait sinon dans `location /` (une page de classement
# charge un avatar par ligne). Le backend les sert avec un `Cache-Control`.
location /avatar/ {
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # En-têtes de sécurité répétés (ceux du parent sont annulés).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Admin routes with stricter rate limiting
location /admin {
    # Une page admin part en rafale (document + appels JSON, jusqu'à 6) :
    # burst=40 couvre ~6 ouvertures. `nodelay` : la réserve passe sans
    # lissage, sinon chaque appel attendrait son tour ; elle se reconstitue à
    # 8 places/s.
    limit_req zone=admin burst=40 nodelay;
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Authentification Discord et invitations : URI publiques menant à des
# écritures en base, d'où une zone dédiée. Le token d'invitation apparaît
# dans les logs : il est haché en base, et sa durée et son nombre d'usages
# sont plafonnés (INVITATION_MAX_* dans constants.py).
location /auth {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /invite {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API des bots Discord, relayée par le frontend (nginx n'est pas sur le réseau
# `backend`).
location /api/bot/ {
    limit_req zone=bot burst=20 nodelay;
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Transmet l'en-tête d'authentification du bot.
    proxy_set_header Authorization $http_authorization;
}

# Flux de la course du banner (service `race`).
location /ws/ {
    # Même résolution dynamique qu'en tête de fichier (`race` est recréé par
    # `make re-race`) ; répété pour la lisibilité.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $race_upstream race:3000;
    proxy_pass http://$race_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Le serveur peut rester silencieux longtemps (onglet en arrière-plan) :
    # sans ces lignes, nginx coupe après 60 s d'inactivité.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;

    # Par IP : plusieurs spectateurs peuvent partager une adresse (box, CGNAT).
    # Une connexion coûte ~1,3 Ko/s ; 20 reste une borne anti-abus.
    limit_conn ws_conn 20;
}

location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://$front$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
