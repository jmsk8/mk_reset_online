client_max_body_size 10M;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Static file caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
}

# Admin routes with stricter rate limiting
location /admin {
    limit_req zone=admin burst=10 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Authentification Discord et invitations. Placé avant `location /` et distinct
# de /admin : ces URI sont publiques (un invité n'a par définition pas encore de
# session) mais mènent à des écritures en base, d'où une zone dédiée.
#
# Le chemin d'une invitation contient son token, et nginx journalise le chemin
# complet : c'est pour ça que le token est haché en base, à TTL court et à usage
# unique — un token qui apparaît dans les logs devient inexploitable après coup.
location /auth {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /invite {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API de service pour les bots Discord. Relayée par le frontend, faute pour
# nginx d'être sur le réseau `backend` — c'est le choix retenu, il n'élargit
# pas la surface réseau exposée.
location /api/bot/ {
    limit_req zone=bot burst=20 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sans cette ligne, l'en-tête d'authentification du bot n'atteindrait pas
    # le frontend et toutes les requêtes repartiraient en 401.
    proxy_set_header Authorization $http_authorization;
}

# Flux de la course du banner (service `race`). Placé avant `location /` :
# le bloc regex des fichiers statiques ne capte pas cette URI, qui n'a pas
# d'extension, et /admin est un préfixe distinct — aucune collision.
location /ws/ {
    # Résolution DNS à chaque requête, et non une seule fois au chargement de
    # la config. `race` est recréé à chaque `make re-race` et repart avec une
    # nouvelle IP : avec un `proxy_pass` littéral, nginx garderait l'ancienne
    # jusqu'au prochain rechargement, et le banner resterait « offline » sans
    # que rien dans les logs du moteur ne l'explique. 127.0.0.11 est le
    # résolveur interne de Docker.
    #
    # Passer par une variable désactive la reprise automatique de l'URI, d'où
    # le `$request_uri` explicite — sans lui, le chemin serait perdu.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $race_upstream race:3000;
    proxy_pass http://$race_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sans ces deux lignes, nginx coupe la connexion au bout de 60 s
    # d'inactivité — or le serveur ne parle que lorsqu'il a quelque chose à
    # dire, et se tait dès qu'un onglet passe en arrière-plan.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;

    limit_conn ws_conn 5;
}

location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
