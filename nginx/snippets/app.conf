client_max_body_size 10M;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Static file caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
}

# Admin routes with stricter rate limiting
location /admin {
    limit_req zone=admin burst=10 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Flux de la course du banner (service `race`). Placé avant `location /` :
# le bloc regex des fichiers statiques ne capte pas cette URI, qui n'a pas
# d'extension, et /admin est un préfixe distinct — aucune collision.
location /ws/ {
    proxy_pass http://race:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sans ces deux lignes, nginx coupe la connexion au bout de 60 s
    # d'inactivité — or le serveur ne parle que lorsqu'il a quelque chose à
    # dire, et se tait dès qu'un onglet passe en arrière-plan.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;

    limit_conn ws_conn 5;
}

location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
