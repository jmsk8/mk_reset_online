client_max_body_size 10M;

# Page servie quand le limiteur de débit rejette une requête. Sans elle, nginx
# renvoie sa page nue « 503 Service Temporarily Unavailable », que l'utilisateur
# lit comme une panne du site -- il rafraîchit aussitôt, ce qui consomme une
# requête de plus sur un budget déjà vide (docs/audit-503-zone-admin.md, §5).
#
# `internal` : ce chemin ne doit répondre qu'à une redirection interne de nginx,
# jamais à une requête directe du navigateur.
#
# La réponse est écrite ici plutôt que dans un fichier : elle doit rester
# servable même si le frontend est en panne, donc sans aucun proxy_pass.
error_page 503 /_limite.html;
location = /_limite.html {
    internal;
    default_type text/html;
    # Dit au navigateur ET aux clients automatiques quand revenir. Le budget se
    # reconstitue à `rate`, soit une place toutes les 0,5 s : 5 s laissent
    # repasser une dizaine de requêtes, de quoi recharger une page entière.
    add_header Retry-After 5 always;
    return 503 '<!doctype html><html lang="fr"><meta charset="utf-8">
<title>Trop de requetes</title>
<style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1rem;line-height:1.6}h1{font-size:1.4rem}</style>
<h1>Un instant</h1>
<p>Trop de requetes ont ete envoyees depuis cet appareil en peu de temps.
Le serveur les limite volontairement.</p>
<p><strong>Patientez cinq secondes</strong>, puis rechargez la page.
Rafraichir tout de suite ne fera que prolonger l\'attente.</p>';
}

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Static file caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
    # Un add_header dans un bloc annule TOUS ceux du parent : sans ces quatre
    # lignes, les fichiers statiques partent sans en-tete de securite.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Avatars. Placé avant `location /` et SANS limiteur de débit, au même titre que
# les fichiers statiques -- ce sont des images, pas des appels d'API.
#
# Leur URI n'a pas d'extension (`/avatar/joueur/12`), donc le bloc regex des
# fichiers statiques ne les capte pas : ils tombaient dans `location /` et
# consommaient la zone `general`. Or la page Classement des joueurs affiche UN
# AVATAR PAR LIGNE : avec 30 joueurs, 31 requêtes limitées pour une seule page,
# soit plus que le `burst` de la zone. La page ne pouvait pas se charger
# entièrement, et le symptôme touchait aussi les visiteurs non connectés
# (constaté en production le 2026-09-17).
#
# Le backend sert déjà ces images avec un `Cache-Control`, relayé tel quel par
# le frontend : le navigateur ne les redemande pas à chaque page.
location /avatar/ {
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Un add_header dans un bloc annule TOUS ceux du parent (même piège que le
    # bloc des fichiers statiques) : sans ces quatre lignes, les avatars
    # partiraient sans en-tête de sécurité.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Admin routes with stricter rate limiting
location /admin {
    # burst=40 : une page admin part en RAFALE -- le document, puis tous ses
    # appels JSON lancés d'un coup. La plus lourde (Réglages) en vaut 6.
    #
    # 40 = ~6 ouvertures de la page la plus lourde avant d'entamer le débit
    # nominal. C'est dimensionné pour l'usage qui a produit les 503 : ouvrir,
    # corriger, rafraîchir pour vérifier, plusieurs fois de suite.
    #
    # `nodelay` est volontaire et doit le rester : sans lui, les requêtes de la
    # réserve sont LISSÉES au lieu de passer tout de suite, et chaque page
    # mettrait plusieurs secondes à s'afficher -- chaque appel JSON attendant son
    # tour à 8r/s. Contrepartie à connaître : la réserve se vide d'un coup et se
    # reconstitue au rythme du `rate` (8 places/s ici, soit 5 s pour refaire les
    # 40). C'est confortable ; à 2r/s c'était 20 s, d'où le symptôme « ça revient
    # au bout d'un moment ».
    limit_req zone=admin burst=40 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Authentification Discord et invitations. Placé avant `location /` et distinct
# de /admin : ces URI sont publiques (un invité n'a par définition pas encore de
# session) mais mènent à des écritures en base, d'où une zone dédiée.
#
# Le chemin d'une invitation contient son token, et nginx journalise le chemin
# complet : c'est pour ça que le token est haché en base, à TTL court et à usage
# unique — un token qui apparaît dans les logs devient inexploitable après coup.
location /auth {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /invite {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API de service pour les bots Discord. Relayée par le frontend, faute pour
# nginx d'être sur le réseau `backend` — c'est le choix retenu, il n'élargit
# pas la surface réseau exposée.
location /api/bot/ {
    limit_req zone=bot burst=20 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sans cette ligne, l'en-tête d'authentification du bot n'atteindrait pas
    # le frontend et toutes les requêtes repartiraient en 401.
    proxy_set_header Authorization $http_authorization;
}

# Flux de la course du banner (service `race`). Placé avant `location /` :
# le bloc regex des fichiers statiques ne capte pas cette URI, qui n'a pas
# d'extension, et /admin est un préfixe distinct — aucune collision.
location /ws/ {
    # Résolution DNS à chaque requête, et non une seule fois au chargement de
    # la config. `race` est recréé à chaque `make re-race` et repart avec une
    # nouvelle IP : avec un `proxy_pass` littéral, nginx garderait l'ancienne
    # jusqu'au prochain rechargement, et le banner resterait « offline » sans
    # que rien dans les logs du moteur ne l'explique. 127.0.0.11 est le
    # résolveur interne de Docker.
    #
    # Passer par une variable désactive la reprise automatique de l'URI, d'où
    # le `$request_uri` explicite — sans lui, le chemin serait perdu.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $race_upstream race:3000;
    proxy_pass http://$race_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sans ces deux lignes, nginx coupe la connexion au bout de 60 s
    # d'inactivité — or le serveur ne parle que lorsqu'il a quelque chose à
    # dire, et se tait dès qu'un onglet passe en arrière-plan.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;

    limit_conn ws_conn 5;
}

location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://frontend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
