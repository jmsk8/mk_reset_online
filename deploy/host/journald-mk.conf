# Conservation des journaux du site -- T5 du registre RGPD.
#
# A DEPLOYER SUR L'HOTE, pas dans un conteneur :
#
#     sudo cp deploy/host/journald-mk.conf /etc/systemd/journald.conf.d/
#     sudo systemctl restart systemd-journald
#     docker compose up -d          # pour que les conteneurs prennent journald
#
# Verifier ensuite, dans cet ordre :
#     ls -d /var/log/journal        # doit exister -> stockage persistant
#     journalctl -t mk-nginx -n 5   # doit sortir des lignes
#
# Un fichier dans journald.conf.d/ plutot qu'une edition de journald.conf :
# une mise a jour de la distribution ecrase le second, jamais le premier.

[Journal]

# Sans ca, les journaux vivent dans /run et sont PERDUS A CHAQUE REBOOT.
# C'est le defaut sur beaucoup de distributions -- il l'etait ici.
# A poser AVANT MaxRetentionSec, qui ne veut rien dire sur du volatile.
Storage=persistent

# La duree annoncee aux visiteurs dans /confidentialite. C'est ce reglage,
# et lui seul, qui la rend vraie : le pilote json-file d'avant ne bornait
# que la taille, ce qui n'est pas une duree.
MaxRetentionSec=6month

# Garde-fou disque, independant de l'age : si le trafic explose, on perd les
# lignes les plus vieilles plutot que de remplir le disque. Les deux bornes
# se cumulent, la premiere atteinte gagne.
SystemMaxUse=500M
