# Conservation des journaux du site (registre RGPD, T5).
#
# A installer sur l'hote :
#
#     sudo mkdir -p /etc/systemd/journald.conf.d
#     sudo cp deploy/host/journald-mk.conf /etc/systemd/journald.conf.d/
#     sudo systemctl restart systemd-journald
#     sudo journalctl --flush       # verse dans /var ce qui est dans /run
#     docker compose up -d          # seulement si les conteneurs sont encore
#                                   # sur json-file (voir ci-dessous)
#
# `docker compose up -d` recree les conteneurs sur le code du depot : verifier
# d'abord si c'est utile :
#     docker inspect --format '{{.Name}} {{.HostConfig.LogConfig.Type}}' $(docker ps -q)
#
# Verification :
#     systemd-analyze cat-config systemd/journald.conf | tail -5
#     ls -d /var/log/journal        # stockage persistant
#     journalctl -t mk-nginx -n 5   # doit sortir des lignes
#
# Ces bornes s'appliquent a tout le journal de la machine.
# une mise a jour de la distribution ecrase le second, jamais le premier.

[Journal]
# Sinon les journaux restent dans /run et sont perdus a chaque reboot.
# A poser AVANT MaxRetentionSec, qui ne veut rien dire sur du volatile.
Storage=persistent
# Duree annoncee dans /confidentialite.
# que la taille, ce qui n'est pas une duree.
MaxRetentionSec=6month
# Garde-fou disque ; la premiere borne atteinte s'applique.
# se cumulent, la premiere atteinte gagne.
SystemMaxUse=500M
